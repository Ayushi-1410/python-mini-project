<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173d3b">
    <title>{% block title %}Smart Care{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('home') if current_staff else url_for('login') }}" aria-label="Smart Care home">
            <span class="brand-mark" aria-hidden="true">SC</span>
            <span class="brand-copy"><strong>Smart Care</strong></span>
        </a>
        <nav class="topbar-actions" aria-label="Account and appearance">
            {% if current_staff %}
                <span class="staff-greeting">{{ current_staff }}</span>
                <form action="{{ url_for('logout') }}" method="post" class="logout-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button class="logout-button" type="submit">Log out</button>
                </form>
            {% else %}
                <span class="topbar-note">Staff-managed prioritization</span>
            {% endif %}
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
                <span class="theme-icon" aria-hidden="true">☾</span>
                <span class="theme-label">Dark mode</span>
            </button>
        </nav>
    </header>
    <main class="page">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">Priority categories are staff-selected and are not a clinical diagnosis.</footer>
</body>
</html>
